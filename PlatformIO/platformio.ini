; adc2can - Forbes Automotive
; 8 channel 0-5 V sensor to CAN adapter (ESP32-S3-WROOM-1-N16R8)

[platformio]
; Keep transient build/dependency files off the Google-Drive folder (as can2gauge / OpenHaldex-C6: Drive locking
; cached build dirs causes spurious rebuilds and WinError 5/145).
build_dir = ${sysenv.SYSTEMDRIVE}/.platformio/adc2can-pio/build
libdeps_dir = ${sysenv.SYSTEMDRIVE}/.platformio/adc2can-pio/libdeps
default_envs = adc2can

[env:adc2can]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200

board_build.filesystem = littlefs
board_build.partitions = partitions_16mb.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    ; network (AsyncTCP build options, consumed by the library at compile time)
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=0
    -D CONFIG_ASYNC_TCP_USE_WDT=0

lib_deps =
    mathieucarbou/AsyncTCP@^3.1.4
    mathieucarbou/ESP Async WebServer@^3.0.6
    bblanchon/ArduinoJson@^7.0.0

lib_ignore =
    Async TCP
    AsyncTCP_RP2040W
    AsyncTCP_SSL
    ESPUI

monitor_filters =
    esp32_exception_decoder
    colorize
